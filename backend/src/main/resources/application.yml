spring:
  application:
    name: configvault-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/configvault}
    username: ${DATABASE_USERNAME:configvault}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

configvault:
  auth:
    username: ${CONFIGVAULT_ADMIN_USERNAME:admin}
    password: ${CONFIGVAULT_ADMIN_PASSWORD:admin}
  encryption:
    key: ${CONFIGVAULT_ENCRYPTION_KEY}
    key-id: ${CONFIGVAULT_ENCRYPTION_KEY_ID:local-v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
